# Read the Docs configuration for the openinference-instrumentation API reference.
# Point the Read the Docs project's "Path for .readthedocs.yaml" setting at this file.
# Paths below are relative to the repository root.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: python/openinference-instrumentation/docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: python/openinference-instrumentation/docs/requirements.txt
    - method: pip
      path: python/openinference-instrumentation
