        [\n          {\n            \"text\": \"The sky appears blue due to a phenomenon
        called **Rayleigh scattering**. Here's a breakdown of why it happens:\\n\\n1.
        \ **Sunlight is White:** Sunlight, as we perceive it, is actually a mixture
        of all the colors of the rainbow (red, orange, yellow, green, blue, indigo,
        violet). Each of these colors has a different wavelength, with red light having
        the longest wavelength and violet light having the shortest.\\n\\n2.  **Earth's
        Atmosphere:** Our atmosphere is made up of tiny particles, primarily nitrogen
        and oxygen molecules, as well as smaller amounts of other gases and dust.\\n\\n3.
        \ **Scattering of Light:** When sunlight enters the Earth's atmosphere, it
        interacts with these tiny molecules. The light waves bump into these particles
        and are scattered in all directions.\\n\\n4.  **Wavelength Matters:** This
        scattering is not uniform for all colors. Shorter wavelengths of light (like
        blue and violet) are scattered much more effectively by these small atmospheric
        particles than longer wavelengths (like red and orange).\\n\\n5.  **Blue is
        Scattered Most:** Because blue light has a shorter wavelength, it gets scattered
        in all directions more than other colors. This scattered blue light reaches
        our eyes from all parts of the sky, making it appear blue.\\n\\n6.  **Why
        Not Violet?** You might wonder why the sky isn't violet, as violet light has
        an even shorter wavelength than blue and is scattered even more. There are
        a couple of reasons:\\n    *   **Our Eyes' Sensitivity:** Our eyes are more
        sensitive to blue light than to violet light.\\n    *   **Sun's Spectrum:**
        The sun emits slightly less violet light than blue light.\\n\\n**In simple
        terms:** Imagine sunlight as a mix of different sized marbles. When they hit
        small obstacles, the smaller marbles (blue and violet light) bounce around
        much more than the larger marbles (red and orange light). Our eyes then see
        all these scattered blue marbles coming from every direction.\\n\\n**What
        about sunsets and sunrises?**\\nDuring sunrise and sunset, the sun's rays
        have to travel through much more of the Earth's atmosphere to reach our eyes.
        This means that even more of the blue and violet light is scattered away.
        The longer wavelengths (red, orange, and yellow) are less scattered and are
        therefore more prominent, giving us those beautiful red and orange hues.\"\n
