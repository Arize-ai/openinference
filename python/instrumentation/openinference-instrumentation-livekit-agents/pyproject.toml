[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openinference-instrumentation-livekit-agents"
dynamic = ["version"]
description = "Maps livekit-agents voice turns onto OpenInference spans"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10, <3.15"
authors = [
  { name = "OpenInference Authors", email = "oss@arize.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation",
  "openinference-instrumentation>=0.1.71",
  "openinference-semantic-conventions>=0.1.41",
  "wrapt",
]

[project.optional-dependencies]
instruments = [
  "livekit-agents",
]

[project.entry-points.opentelemetry_instrumentor]
livekit_agents = "openinference.instrumentation.livekit_agents:LiveKitAgentsInstrumentor"

[project.entry-points.openinference_instrumentor]
livekit_agents = "openinference.instrumentation.livekit_agents:LiveKitAgentsInstrumentor"

[project.urls]
Homepage = "https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-livekit-agents"

[tool.hatch.version]
path = "src/openinference/instrumentation/livekit_agents/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openinference"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.mypy]
strict = true
explicit_package_bases = true
exclude = [
  "examples",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
force-single-line = false
