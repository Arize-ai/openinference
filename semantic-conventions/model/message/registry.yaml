file_format: definition/2
attributes:
  - key: message.role
    type: string
    brief: "Role of the entity in a message (e.g., user, system)"
    examples: ["user", "system"]
    stability: development
  - key: message.content
    type: string
    brief: "The content of a message in a chat"
    examples: ["What's the weather today?"]
    stability: development
  - key: message.contents
    type: template[any]
    brief: "The message contents to the LLM, an array of `message_content` objects. Use this form when a message has multiple content items or when item ordering matters."
    examples: ['[{"message_content.type": "text", "message_content.text": "Hello"}]']
    stability: development
    annotations:
      openinference:
        encoding: flattened_list
        item_namespaces: ["message_content"]
  - key: message.name
    type: string
    brief: "The name of the function or tool that produced a tool/function role message. Used when `message.role` is `\"tool\"` or `\"function\"` to identify the origin."
    examples: ["multiply"]
    stability: development
  - key: message.tool_calls
    type: template[any]
    brief: "List of tool calls (e.g. function calls) generated by the LLM, e.g. `llm.output_messages.0.message.tool_calls.0.tool_call.id`"
    examples: ['[{"tool_call.function.name": "get_current_weather"}]']
    stability: development
    annotations:
      openinference:
        encoding: flattened_list
        item_namespaces: ["tool_call"]
  - key: message.tool_call_id
    type: string
    brief: "Tool call result identifier corresponding to `tool_call.id`"
    examples: ["call_62136355"]
    stability: development
  - key: message.function_call_name
    type: string
    brief: "Function call function name"
    examples: ["multiply"]
    stability: development
    deprecated:
      reason: uncategorized
      note: "Use `message.tool_calls` instead."
  - key: message.function_call_arguments_json
    type: string
    brief: "The arguments to the function call in JSON"
    examples: ["{ 'x': 2 }"]
    stability: development
    deprecated:
      reason: uncategorized
      note: "Use `message.tool_calls` instead."
    annotations:
      openinference:
        encoding: json
  - key: message_content.type
    type:
      members:
        - id: text
          value: "text"
          brief: "Text content."
          stability: development
        - id: image
          value: "image"
          brief: "Image content."
          stability: development
        - id: audio
          value: "audio"
          brief: "Audio content."
          stability: development
        - id: video
          value: "video"
          brief: "Video content."
          stability: development
        - id: document
          value: "document"
          brief: "Document content, e.g. a PDF, an uploaded file, or inline text."
          stability: development
        - id: reasoning
          value: "reasoning"
          brief: "Reasoning or thinking content, including redacted reasoning."
          stability: development
        - id: tool_use
          value: "tool_use"
          brief: "A tool call returned as an ordered content part."
          stability: development
    brief: "The type of the content. Use `\"reasoning\"` for reasoning/thinking content, including Anthropic `redacted_thinking` blocks. Use `\"tool_use\"` when a provider returns a tool call as an ordered content part."
    examples: ["text", "image", "audio", "video", "document", "reasoning", "tool_use"]
    stability: development
  - key: message_content.text
    type: string
    brief: "The text content of the message. Used when `message_content.type` is `\"text\"` or `\"reasoning\"` (visible reasoning or summary text). For OpenAI `summary_text` arrays, concatenate the array items into this single text value for now."
    examples: ["This is a sample text"]
    stability: development
  - key: message_content.image
    type: template[any]
    brief: "The image content of the message, if the type is `\"image\"`."
    examples: ['{"image.url": "https://sample-link-to-image.jpg"}']
    stability: development
    annotations:
      openinference:
        encoding: flattened_object
        item_namespaces: ["image"]
  - key: message_content.audio
    type: template[any]
    brief: "The audio content of the message, if the type is `\"audio\"`. Nested leaves are `audio.url` and `audio.transcript`."
    examples: ['{"audio.url": "https://example.com/audio.mp3"}']
    stability: development
    annotations:
      openinference:
        encoding: flattened_object
        item_namespaces: ["audio"]
  - key: message_content.video
    type: template[any]
    brief: "The video content of the message, if the type is `\"video\"`. The nested leaf is `video.url`. Consumers infer MIME type from the URL path extension or a data URI prefix."
    examples: ['{"video.url": "gs://bucket/clip.mp4"}']
    stability: development
    annotations:
      openinference:
        encoding: flattened_object
        item_namespaces: ["video"]
  - key: message_content.document
    type: template[any]
    brief: "The document content of the message (e.g. a PDF, an uploaded file, or inline text), if the type is `\"document\"`. Nested leaves are `document.url`, `document.content`, `document.mime_type`, `document.id`, and `document.name`."
    examples: ['{"document.url": "data:application/pdf;base64,JVBERi0...", "document.mime_type": "application/pdf"}']
    stability: development
    annotations:
      openinference:
        encoding: flattened_object
        item_namespaces: ["document"]
  - key: message_content.id
    type: string
    brief: "Provider-assigned identifier for this message content item. For OpenAI Responses reasoning items, this maps to `ResponseReasoningItem.id` and should be preserved for stateless replay."
    examples: ["rs_abc123"]
    stability: development
  - key: message_content.signature
    type: string
    brief: "Opaque vendor-issued signature captured verbatim. Maps to provider `signature` fields, and to Gemini `thoughtSignature` fields when the signature is attached to a non-tool content part such as text."
    examples: ["EuYBCkQYAiJA..."]
    stability: development
  - key: message_content.data
    type: string
    brief: "Opaque vendor-issued data captured verbatim. Maps to Anthropic `redacted_thinking.data`."
    examples: ["EmwKAhgBEgy3..."]
    stability: development
  - key: message_content.encrypted_content
    type: string
    brief: "OpenAI `encrypted_content` captured verbatim."
    examples: ["gAAAAA...=="]
    stability: development
