name: GitHub scripts

on:
    pull_request:
        paths:
            - ".github/.scripts/**"
            - ".github/workflows/github-scripts.yml"
            - "CONTRIBUTING"

permissions: {}

jobs:
    test:
        name: Test workflow scripts
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - run: node --test .github/.scripts/pr-issue-policy.test.js
