name: Typescript Publish
on:
  push:
    branches:
      - main
permissions: {}
env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store
  # `changeset publish` shells out to `pnpm publish` without a --provenance
  # flag, so provenance is enabled through npm config instead.
  NPM_CONFIG_PROVENANCE: true
jobs:
  version:
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # changesets/action is configured below to use git-cli commit mode, so
          # this checkout intentionally keeps credentials available for git push.
          persist-credentials: true
          token: ${{ secrets.MY_CHANGESET_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/
          scope: "@arizeai"
      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.29.3
      - name: Setup pnpm config
        run: pnpm config set store-dir $PNPM_CACHE_FOLDER

      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile
      - name: Create and publish versions
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.MY_CHANGESET_TOKEN }}
          version-script: pnpm ci:version
          commit-message: "chore(js): update versions"
          pr-title: "chore(js): update versions"
          publish-script: pnpm ci:publish
          create-github-releases: true
          push-with-git-cli: true
          cwd: "${{ github.workspace }}/js"

  slack:
    name: Slack notification
    needs: [version]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send message to Slack
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('🚨 TypeScript publish failed on {0}: {1}/{2}/actions/runs/{3}', github.sha, github.server_url, github.repository, github.run_id)) }}
            }
