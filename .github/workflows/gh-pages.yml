name: Deploy GitHub Pages

# Builds the Astro site in `site/` (README, spec, and translated READMEs) plus
# the TypeDoc API reference served at /js/, then deploys to GitHub Pages.
# See https://docs.astro.build/en/guides/deploy/github/

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Generates the TypeDoc reference for the JavaScript packages
  typedoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.29.3

      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Prebuild packages
        working-directory: js
        run: pnpm run -r prebuild

      - name: Build packages
        working-directory: js
        run: pnpm run -r build

      - name: Build TypeDoc documentation
        working-directory: js
        run: pnpm run docs:generate

      - name: Upload TypeDoc output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: typedoc
          path: js/docs
          retention-days: 1

  # Builds the Astro site with the TypeDoc output under /js/
  build:
    runs-on: ubuntu-latest
    needs: typedoc
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download TypeDoc output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typedoc
          # Files in public/ are copied verbatim into the built site.
          path: site/public/js

      - name: Install, build, and upload site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
