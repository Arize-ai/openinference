name: Deploy GitHub Pages

# Builds the Astro site in `site/` (README, spec, translated READMEs, and the
# API references at /js/ and /python/), then deploys to GitHub Pages.
# See https://docs.astro.build/en/guides/deploy/github/

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab. The
  # "Semantic Conventions Release" workflow also starts it this way, once it
  # has attached a registry's assets to its release.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Extracts the JavaScript packages' API with TypeDoc, which needs the js/
  # workspace installed and built (a package's types import its siblings'
  # built declarations)
  js-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.29.3

      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Prebuild packages
        working-directory: js
        run: pnpm run -r prebuild

      - name: Build packages
        working-directory: js
        run: pnpm run -r build

      # Writes site/src/generated/js-api.json, which the pages under
      # site/src/pages/js/ render.
      - name: Extract the JavaScript API
        working-directory: site
        run: node scripts/js-api.mjs

      - name: Upload the JavaScript API
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: js-api
          path: site/src/generated/js-api.json
          retention-days: 1

  # Builds the Astro site, with both API references
  build:
    runs-on: ubuntu-latest
    needs: js-api
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the JavaScript API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-api
          path: site/src/generated

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Reads python/ statically with griffe (nothing is imported or installed
      # but griffe) and writes site/src/generated/python-api.json, which the
      # pages under site/src/pages/python/ render.
      - name: Extract the Python API
        working-directory: site
        run: uv run scripts/python-api.py

      # The semantic convention registry, served at its schema URL
      # (/schemas/<version>/). Released versions are served from their release
      # assets, so a published version never changes. The version in the
      # repository is built from the model when it has no release yet.
      - name: Download the released registries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tags are listed by prefix: the repository has far more releases
          # than one page of `gh release list`. The matching tags are paged
          # too (30 a page), so every page is read.
          gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/semantic-conventions-v" --jq '.[].ref' |
          while read -r ref; do
            tag="${ref#refs/tags/}"
            version="${tag#semantic-conventions-v}"
            target="site/src/generated/schemas/${version}"
            mkdir -p "$target"
            # A release whose assets are missing is skipped, not fatal: the
            # site must still deploy. Both files are needed: the download
            # succeeds when only one of them is attached.
            if ! gh release download "$tag" --dir "$target" --pattern manifest.yaml --pattern registry.yaml ||
              [[ ! -s "$target/manifest.yaml" || ! -s "$target/registry.yaml" ]]; then
              echo "::warning::Registry assets are missing on release ${tag}; /schemas/${version}/ is not served from them."
              rm -f "$target/manifest.yaml" "$target/registry.yaml"
              rmdir "$target"
            fi
          done

      - name: Load the Weaver version
        id: versions
        working-directory: semantic-conventions
        run: |
          weaver_version="$(sed -n 's/^WEAVER_VERSION=v\{0,1\}//p' versions.env)"
          if [[ -z "$weaver_version" ]]; then
            echo "Failed to load WEAVER_VERSION from versions.env" >&2
            exit 1
          fi
          echo "weaver_version=$weaver_version" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: ${{ steps.versions.outputs.weaver_version }}

      - name: Build the registry for an unreleased version
        working-directory: semantic-conventions
        run: |
          version="$(make -s print-version)"
          if [[ -f "../site/src/generated/schemas/${version}/manifest.yaml" ]]; then
            echo "Version ${version} is released; serving its release assets."
          else
            make site-schemas
          fi

      - name: Install, build, and upload site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
