plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

description = 'OpenInference Instrumentation for Google ADK Java (ByteBuddy Java agent)'

ext {
    adkVersion = '0.4.0'
}

// docker-java (container code executors) is not needed to compile or test the advice.
def adkExclusions = {
    exclude group: 'com.github.docker-java', module: 'docker-java'
    exclude group: 'com.github.docker-java', module: 'docker-java-transport-httpclient5'
}

// The compatibility test source set is declared before the dependencies block so that its
// `compatTestImplementation` configuration exists when dependencies are added below. The test is
// reflection-only; main output supplies TelemetryAgent and the advice classes and no ADK is added.
sourceSets {
    compatTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    // Brings openinference-semantic-conventions, the OpenTelemetry API/SDK BOM, TraceConfig,
    // SuppressTracing and OpenInferenceAgent (shared with the other Java instrumentors).
    api project(':openinference-instrumentation')

    // The instrumented library is provided by the application at runtime and must never be
    // bundled into the agent jar, otherwise the agent's copy shadows the application's version.
    compileOnly("com.google.adk:google-adk:${adkVersion}", adkExclusions)

    implementation "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    testImplementation "io.opentelemetry:opentelemetry-sdk-testing"
    // The integration test runs a real ADK Runner with a scripted model and installs the agent
    // into the test JVM through the attach API.
    testImplementation("com.google.adk:google-adk:${adkVersion}", adkExclusions)
    testImplementation "net.bytebuddy:byte-buddy-agent:${byteBuddyVersion}"

    // The compatibility test is reflection-only (no com.google.adk.* on its compile or compile
    // classpath). It needs the agent, its runtime libraries and the test libraries, but no ADK:
    // each compatTestAdk* task contributes exactly one google-adk version on the runtime only.
    compatTestImplementation project(':openinference-instrumentation')
    compatTestImplementation "io.opentelemetry:opentelemetry-sdk-testing"
    compatTestImplementation "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
    compatTestImplementation "net.bytebuddy:byte-buddy-agent:${byteBuddyVersion}"
    compatTestImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    compatTestImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
    compatTestImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    compatTestImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    compatTestImplementation "org.mockito:mockito-core:${mockitoVersion}"
    compatTestImplementation "org.assertj:assertj-core:${assertjVersion}"
}

test {
    // ByteBuddyAgent.install() attaches to the running test JVM.
    jvmArgs '-Djdk.attach.allowAttachSelf=true'
}

// The plain jar stays enabled so the root maven publication (`from components.java`) has an
// artifact to publish; the fat `-all` shadow jar is what users pass to `-javaagent:`.
def agentManifest = [
        'Premain-Class'          : 'com.arize.instrumentation.adk.TelemetryAgent',
        'Agent-Class'            : 'com.arize.instrumentation.adk.TelemetryAgent',
        'Can-Redefine-Classes'   : 'true',
        'Can-Retransform-Classes': 'true',
]

jar {
    manifest {
        attributes(agentManifest)
    }
}

shadowJar {
    archiveClassifier.set('all')
    manifest {
        attributes(agentManifest)
    }

    exclude('META-INF/*.SF')
    exclude('META-INF/*.DSA')
    exclude('META-INF/*.RSA')
}

// --- Multi-version traceCallLlm compatibility tests -------------------------------------------
// One reflection-only test class compiles once with no ADK on its classpath and is executed by
// four isolated Test tasks, each resolving exactly one real google-adk version. The normal 0.4.0
// dependency lives on the `test` source set only and never reaches these classpaths.

def compatAdkVersions = [
        compatTestAdk060 : [version: '0.6.0', arity: 4],
        compatTestAdk090 : [version: '0.9.0', arity: 5],
        compatTestAdk100 : [version: '1.0.0', arity: 6],
        compatTestAdk1101: [version: '1.10.1', arity: 6],
]

compatAdkVersions.each { taskName, cfg ->
    def adkConfiguration = "${taskName}Adk"
    configurations.create(adkConfiguration) {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom(configurations.compatTestImplementation, configurations.compatTestRuntimeOnly)
    }
    dependencies.add(adkConfiguration, "com.google.adk:google-adk:${cfg.version}") {
        exclude group: 'com.github.docker-java', module: 'docker-java'
        exclude group: 'com.github.docker-java', module: 'docker-java-transport-httpclient5'
    }
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Reflection-based traceCallLlm compatibility test against ADK ${cfg.version} (arity ${cfg.arity})."
        testClassesDirs = sourceSets.compatTest.output.classesDirs
        // One resolution graph: the per-version configuration already extends the compatTest
        // dependencies, so this adds exactly one ADK version with conflict resolution.
        classpath = files(sourceSets.compatTest.output, sourceSets.main.output, configurations."${adkConfiguration}")
        useJUnitPlatform()
        jvmArgs '-Djdk.attach.allowAttachSelf=true'
        systemProperty 'adk.expected.arity', cfg.arity
    }
}

tasks.named('check') {
    dependsOn compatAdkVersions.keySet().collect { tasks.named(it) }
}
